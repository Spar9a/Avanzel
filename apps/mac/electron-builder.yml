appId: app.avanzel.mac
productName: Avanzel
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
  - "!**/node_modules/onnxruntime-node/bin/napi-v*/linux/**"
  - "!**/node_modules/onnxruntime-node/bin/napi-v*/win32/**"
asarUnpack:
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/onnxruntime-common/**"
extraResources:
  - from: native/calltap/build
    to: calltap
    filter: ["avanzel-calltap"]
  - from: native/cursor/build
    to: cursor
    filter: ["avanzel-cursor"]
npmRebuild: false
# Electron's fuses, switches in its binary flipped before signing (https://www.electronjs.org/docs/latest/tutorial/fuses).
# This is the review build's set, which `npm run dist` and the flight pack's review builds use. The public release
# (electron-builder.release.yml) turns the --inspect arguments off as well: Playwright drives a packaged app through
# them (e2e/packaged.spec.ts), so review builds keep them.
electronFuses:
  # On for now: the engine's write guard runs Avanzel's own binary as Node (packages/engine/src/core/guard-hook.ts).
  # Turn it off once the guard no longer needs it.
  runAsNode: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: true
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Signs the flipped binary ad hoc, so the app opens even before its real signature (signing.mjs, or the release's).
  resetAdHocDarwinSignature: true
mac:
  target: dir
  category: public.app-category.productivity
  icon: build/icon.icns
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Avanzel listens only while you can see it listening, and turns speech into text on this Mac.
    NSAudioCaptureUsageDescription: Avanzel listens to a call's sound only while you have asked it to take notes, and turns it into text on this Mac.
    NSAppleEventsUsageDescription: Avanzel asks your browser which page you were on when you capture the screen with a comment.
